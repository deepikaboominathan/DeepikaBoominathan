<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="Animated neural network illustration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0221"/>
      <stop offset="0.5" stop-color="#1a0642"/>
      <stop offset="1" stop-color="#0D0221"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="180" rx="14" fill="url(#bg)"/>

  <!-- edges: layer 1 -> 2 -->
  <g stroke="url(#edge)" stroke-width="1" opacity="0.35" fill="none">
    <path d="M150 30 L330 20"/><path d="M150 30 L330 75"/><path d="M150 30 L330 130"/>
    <path d="M150 90 L330 20"/><path d="M150 90 L330 75"/><path d="M150 90 L330 130"/>
    <path d="M150 150 L330 75"/><path d="M150 150 L330 130"/><path d="M150 150 L330 160"/>
    <!-- layer 2 -> 3 -->
    <path d="M330 20 L510 45"/><path d="M330 20 L510 110"/>
    <path d="M330 75 L510 45"/><path d="M330 75 L510 110"/><path d="M330 75 L510 150"/>
    <path d="M330 130 L510 45"/><path d="M330 130 L510 110"/><path d="M330 130 L510 150"/>
    <path d="M330 160 L510 110"/><path d="M330 160 L510 150"/>
    <!-- layer 3 -> 4 -->
    <path d="M510 45 L690 30"/><path d="M510 45 L690 90"/>
    <path d="M510 110 L690 30"/><path d="M510 110 L690 90"/><path d="M510 110 L690 150"/>
    <path d="M510 150 L690 90"/><path d="M510 150 L690 150"/>
    <!-- layer 4 -> output -->
    <path d="M690 30 L810 90"/><path d="M690 90 L810 90"/><path d="M690 150 L810 90"/>
  </g>

  <!-- nodes -->
  <g fill="#0D0221" stroke="#A855F7" stroke-width="1.5">
    <circle cx="150" cy="30" r="6"/><circle cx="150" cy="90" r="6"/><circle cx="150" cy="150" r="6"/>
    <circle cx="330" cy="20" r="6"/><circle cx="330" cy="75" r="6"/><circle cx="330" cy="130" r="6"/><circle cx="330" cy="160" r="6"/>
    <circle cx="510" cy="45" r="6"/><circle cx="510" cy="110" r="6"/><circle cx="510" cy="150" r="6"/>
    <circle cx="690" cy="30" r="6"/><circle cx="690" cy="90" r="6"/><circle cx="690" cy="150" r="6"/>
  </g>
  <circle cx="810" cy="90" r="9" fill="#0D0221" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="810" cy="90" r="22" fill="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- slow signal pulses travelling through the network -->
  <circle r="3.5" fill="#00D4FF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M150 30 L330 75 L510 110 L690 90 L810 90"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#A855F7">
    <animateMotion dur="7s" begin="1.5s" repeatCount="indefinite" path="M150 150 L330 130 L510 45 L690 30 L810 90"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#FFFFFF">
    <animateMotion dur="8s" begin="3s" repeatCount="indefinite" path="M150 90 L330 20 L510 110 L690 150 L810 90"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="8s" begin="3s" repeatCount="indefinite"/>
  </circle>
</svg>
